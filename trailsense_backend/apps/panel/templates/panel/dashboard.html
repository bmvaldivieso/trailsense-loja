{% extends "panel/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'panel/css/dashboard.css' %}">
{% endblock %}

{% block content %}
<div class="row g-4">
    <div class="col-12 col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold text-dark mb-0 fs-5">Senderos</h4>
            <a href="{% url 'panel:senderos' %}" class="text-decoration-none fw-semibold text-dark small">Ver Todo</a>
        </div>
        <div class="row g-3">
            <!-- Contenido real de senderos se conecta en el Sprint 6 -->
        </div>
    </div>

    <div class="col-12 col-lg-4">
        <h4 class="fw-bold text-dark mb-3 fs-5">Actividad Reciente</h4>
        <div class="card border-0 rounded-4 p-3 shadow-sm bg-white">
            <!-- Se conecta con datos reales cuando existan reportes/recorridos -->
        </div>
    </div>
</div>
{% endblock %}
