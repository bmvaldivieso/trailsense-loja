{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - TrailSense Loja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{% static 'panel/css/login.css' %}">
</head>
<body>
    <div class="container-fluid p-0 mh-100vh">
        <div class="row g-0 h-100">
            <div class="col-12 col-md-5 col-lg-4 d-flex align-items-center justify-content-center bg-white p-4 p-md-5">
                <div class="w-100 max-w-360">
                    <div class="text-center mb-5">
                        <div class="app-logo-circle mx-auto d-flex align-items-center justify-content-center">
                            <i class="bi bi-geo-alt-fill fs-1 text-white"></i>
                        </div>
                    </div>

                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark">Dirección de Correo Electrónico</label>
                            <input type="email" name="email" class="form-control form-control-custom" id="email" required>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-1">
                                <label for="password" class="form-label fw-semibold text-dark mb-0">Contraseña</label>
                                <a href="#" class="text-decoration-none small text-primary">¿Has olvidado tu contraseña?</a>
                            </div>
                            <div class="position-relative">
                                <input type="password" name="password" class="form-control form-control-custom pe-5" id="password" required>
                                <span class="position-absolute end-0 top-50 translate-middle-y me-3 cursor-pointer text-muted" id="togglePassword">
                                    <i class="bi bi-eye"></i>
                                </span>
                            </div>
                        </div>

                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember">
                            <label class="form-check-label text-secondary fs-7 fw-medium" for="remember">Mantener sesión iniciada</label>
                        </div>

                        <button type="submit" class="btn btn-primary btn-custom w-100 fw-semibold mb-4">Iniciar Sesión</button>
                    </form>
                </div>
            </div>

            <div class="col-12 col-md-7 col-lg-8 d-none d-md-block hero-bg"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'panel/js/login.js' %}"></script>
</body>
</html>
