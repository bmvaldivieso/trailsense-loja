{% extends "panel/base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'panel/css/notificaciones.css' %}">
{% endblock %}

{% block content %}
{% csrf_token %}

<div class="d-flex justify-content-between align-items-center mb-3">
    <h4 class="fw-bold text-dark mb-0 fs-5">Gestor de Notificaciones</h4>
    <button type="button" id="btnNuevaNotificacion" class="btn btn-primary rounded-3 px-4"><i class="bi bi-plus-circle"></i> Nuevo</button>
</div>

<div class="row g-4 mb-4" id="gridNotificaciones"></div>
<div id="mensajeVacioNotif" class="alert alert-info d-none">Aún no has creado notificaciones. Usa el botón "Nuevo".</div>

<div class="notif-search-floating">
    <div class="position-relative">
        <i class="bi bi-search position-absolute start-0 top-50 translate-middle-y ms-3 text-muted"></i>
        <input type="text" id="buscarNotifInput" class="form-control rounded-pill bg-white ps-5 pe-3 shadow" placeholder="Buscar por título, tipo o fecha...">
    </div>
</div>

<div id="overlayNotif" class="overlay-detalle d-none"></div>
<aside id="sidebarNotif" class="sidebar-detalle">
    <div class="detalle-header text-center py-3 border-bottom">
        <span class="text-primary fw-semibold" id="tituloSidebarNotif">Imagen Adjunta</span>
        <div class="detalle-header-accent mt-2"></div>
    </div>
    <div id="contenidoNotif" class="p-3"></div>
</aside>
{% endblock %}

{% block extra_js %}
<script src="{% static 'panel/js/notificaciones.js' %}"></script>
{% endblock %}
