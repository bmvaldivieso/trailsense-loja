# =============================================================================
# Nginx - TrailSense Loja (detrás del proxy de Cloudflare, modo SSL "Full (strict)")
# =============================================================================

# Rechaza peticiones que no vengan con el dominio (escaneos por IP, bots).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate     /etc/ssl/cloudflare/trailsense-loja.pem;
    ssl_certificate_key /etc/ssl/cloudflare/trailsense-loja.key;
    return 444;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trailsense-loja.com www.trailsense-loja.com;
    return 301 https://trailsense-loja.com$request_uri;
}

# HTTPS: panel web + API de la app
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trailsense-loja.com www.trailsense-loja.com;

    ssl_certificate     /etc/ssl/cloudflare/trailsense-loja.pem;
    ssl_certificate_key /etc/ssl/cloudflare/trailsense-loja.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    # Fotos de incidencias (hasta 5), portadas y archivos GPX/TCX.
    client_max_body_size 30M;

    # www -> dominio principal
    if ($host = www.trailsense-loja.com) {
        return 301 https://trailsense-loja.com$request_uri;
    }

    # La raíz del dominio lleva al login del panel.
    location = / {
        return 302 /panel/login/;
    }

    # CSS, JS e imágenes del panel y del admin de Django (generados con collectstatic).
    location /static/ {
        alias /var/www/trailsense/static/;
        expires 7d;
        access_log off;
    }

    # Todo lo demás va a Django.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
